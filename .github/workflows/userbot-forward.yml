name: userbot-forward
# Userbot: file posts (new + full history) from source channels where the bot is NOT admin go into the separate
# "filesbull Userbot Inbox" channel (never straight into Backup); the bot then names/categorises them and settles them
# into Backup (Aarav, Oct 26 2026). Gentle: every 10 min, max 25 files per run (15 after a long FloodWait), live first,
# 2–4 s apart, stops on FloodWait. The session comes from the bot only after GitHub's OIDC token proves this is this workflow on main; it is
# never printed. See tools/userbot_runner.py. Which bot: input bot_url → repo variable BOT_URL (a fork sets it, or
# the bot sets it itself when its GH_TOKEN may) → the original bot when this is the original repo. "🔄 Abhi check karo" in the bot starts it at once (workflow_dispatch).
on:
  workflow_dispatch:
    inputs:
      why:
        description: "who started it (optional)"
        required: false
        default: ""
      bot_url:
        description: "bot address (the bot fills it; else the repo variable BOT_URL is used)"
        required: false
        default: ""
  schedule:
    - cron: "*/10 * * * *"

permissions:
  id-token: write
  contents: read
  actions: write      # a finished run starts the next one ~10 min later (the schedule is best-effort)

concurrency:
  group: userbot-forward
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Forward new files
        env:
          GH_CHAIN_TOKEN: ${{ github.token }}
          BOT_URL_INPUT: ${{ github.event.inputs.bot_url }}
          BOT_URL: ${{ vars.BOT_URL }}
        run: python tools/userbot_runner.py
