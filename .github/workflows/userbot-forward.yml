name: userbot-forward
# Auto-forward NEW file posts from source channels where the bot is NOT admin into the Backup channel, using the
# owner's own Telegram login (Aarav, Oct 26 2026). Gentle: every 10 min, max 25 files per run, 2–4 s apart, stops on
# FloodWait. The session comes from the bot only after GitHub's OIDC token proves this is this workflow on main; it is
# never printed. See tools/userbot_runner.py. "🔄 Abhi check karo" in the bot starts it at once (workflow_dispatch).
on:
  workflow_dispatch:
    inputs:
      why:
        description: "who started it (optional)"
        required: false
        default: ""
  schedule:
    - cron: "*/10 * * * *"

permissions:
  id-token: write
  contents: read

concurrency:
  group: userbot-forward
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Forward new files
        run: python tools/userbot_runner.py
